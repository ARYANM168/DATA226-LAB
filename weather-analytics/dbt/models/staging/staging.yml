version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'WEATHER_DB') }}"
    schema: "{{ env_var('SNOWFLAKE_RAW_SCHEMA', 'RAW') }}"
    tables:
      - name: weather_daily
        description: Daily weather per city from the Open-Meteo forecast API, loaded by Airflow.

models:
  - name: stg_weather_daily
    description: Cleaned daily weather, one row per city per day.
    columns:
      - name: weather_id
        tests: [unique, not_null]
      - name: city
        tests: [not_null]
      - name: weather_date
        tests: [not_null]
      - name: temperature_mean
        tests: [not_null]
      - name: precipitation_mm
        tests: [not_null]
